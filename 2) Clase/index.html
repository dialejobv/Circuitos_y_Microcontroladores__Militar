<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco de pruebas análogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: instrument bench — controls rack on the left, oscilloscope screen on the right, readouts under the screen */
:root{
  --bg:#EEF2F4; --panel:#FBFCFD; --sunk:#E3E9ED; --fg:#13212B; --muted:#4F606B; --line:#CBD5DB;
  --accent:#1D5FA6; --accent-soft:#DCE8F5; --on-accent:#FFFFFF;
  --ok:#2C7A4B; --warn:#A65A0B; --bad:#B3261E;
  --scope:#0D1820; --grid:#24394A; --grid-strong:#36536A; --scope-text:#9DB3C2;
  --ch1:#F2C14E; --ch2:#4FC3E8; --ch3:#E77BB8; --ch4:#9AD97A;
  --sans:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; --mono:'IBM Plex Mono', Consolas, 'Courier New', monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --panel:#15212A; --sunk:#1B2A35; --fg:#E2EAEF; --muted:#9BACB8; --line:#2A3B47;
  --accent:#71A9E6; --accent-soft:#1E3449; --on-accent:#0E161C;
  --ok:#6CC08F; --warn:#E5A15A; --bad:#EF7A6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --panel:#15212A; --sunk:#1B2A35; --fg:#E2EAEF; --muted:#9BACB8; --line:#2A3B47;
  --accent:#71A9E6; --accent-soft:#1E3449; --on-accent:#0E161C;
  --ok:#6CC08F; --warn:#E5A15A; --bad:#EF7A6E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-0.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.badge{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{font:500 14px var(--sans);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bench{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.rack{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.rack h2{font-size:13px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px;font-weight:500}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 8px;align-items:center}
.ctl label{font-size:14px;grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.ctl label .u{color:var(--muted);font-family:var(--mono);font-size:12px}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl input.num{font:500 14px var(--mono);width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--fg);text-align:right}
.ctl.sel{grid-template-columns:minmax(0,1fr)}
select{font:500 14px var(--sans);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--fg);width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.screen{background:var(--scope);border-radius:10px;padding:10px;border:1px solid var(--line)}
.screen canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 13px var(--mono);color:var(--scope-text);padding:6px 4px 0}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.reads{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.read{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.read .k{font-size:12px;color:var(--muted);display:block}
.read .v{font:600 16px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.read.ok{border-left:4px solid var(--ok)} .read.warn{border-left:4px solid var(--warn)} .read.bad{border-left:4px solid var(--bad)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note p{margin:0;max-width:80ch}
.eq{font:500 14px var(--mono);background:var(--sunk);border-radius:6px;padding:6px 10px;overflow-x:auto;white-space:nowrap}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 12px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.on.warn{color:var(--warn);border-color:var(--warn)} .pill.on.bad{color:var(--bad);border-color:var(--bad)} .pill.on.ok{color:var(--ok);border-color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{font:600 14px var(--sans);padding:8px 12px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbl-wrap{overflow-x:auto}
table.res{border-collapse:collapse;font:500 13px var(--mono);font-variant-numeric:tabular-nums;width:100%}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
table.res th{color:var(--muted);font-weight:500}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ex h3{margin:0;font-size:17px}
.ex .meta{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ex p{margin:0;max-width:80ch}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ans label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.ans input{font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--fg)}
.exlist{display:flex;flex-direction:column;gap:12px}
.status{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>


<div class="wrap">
<header>
  <div>
    <span class="badge">Circuitos eléctricos y microcontroladores · laboratorio virtual</span>
    <h1>Banco de pruebas análogo</h1>
    <p class="sub">Simulador de amplificadores operacionales, osciladores, filtros activos, fuentes y reguladores. Cambie los valores, observe el osciloscopio y compare lo medido con la teoría de la clase.</p>
  </div>
</header>

<nav class="tabs" role="tablist" id="tabs"></nav>

<section id="tab-amp" class="tabpane" role="tabpanel"></section>
<section id="tab-multi" class="tabpane" role="tabpanel" hidden></section>
<section id="tab-osc" class="tabpane" role="tabpanel" hidden></section>
<section id="tab-fil" class="tabpane" role="tabpanel" hidden></section>
<section id="tab-src" class="tabpane" role="tabpanel" hidden></section>
<section id="tab-sw" class="tabpane" role="tabpanel" hidden></section>
<section id="tab-act" class="tabpane" role="tabpanel" hidden></section>
</div>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, html='') => { const e=document.createElement(tag); for(const k in attrs){ if(k==='class') e.className=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html) e.innerHTML=html; return e; };
const PREF = [[1e12,'T'],[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
function eng(v, unit='', sig=3){
  if(v===null||v===undefined||Number.isNaN(v)) return '—';
  if(!Number.isFinite(v)) return (v>0?'∞':'−∞')+(unit?' '+unit:'');
  if(v===0) return '0'+(unit?' '+unit:'');
  const a=Math.abs(v); let p=PREF.find(x=>a>=x[0]*0.9995)||PREF[PREF.length-1];
  let n=v/p[0]; let s=Number(n.toPrecision(sig)).toString().replace('.',',').replace('-','−');
  return s+(unit||p[1]?' ':'')+p[1]+unit;
}
function num(v, d=2){ if(!Number.isFinite(v)) return '—'; return v.toFixed(d).replace('.',',').replace('-','−'); }
function parseEng(str){
  if(typeof str!=='string') return NaN;
  let s=str.trim().replace(/\s/g,'').replace(',','.').replace('−','-');
  const m=s.match(/^([-+]?[0-9]*\.?[0-9]+(?:e[-+]?\d+)?)(meg|[pnuµmkMG])?/i);
  if(!m) return NaN;
  let v=parseFloat(m[1]); const suf=m[2];
  const map={p:1e-12,n:1e-9,u:1e-6,'µ':1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9};
  if(suf){ if(suf.toLowerCase()==='meg') v*=1e6; else v*=map[suf]; }
  return v;
}
const par = (...rs) => { let g=0; for(const r of rs){ if(r>0 && Number.isFinite(r)) g+=1/r; } return g>0?1/g:Infinity; };
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
/* complejos */
const C=(re,im=0)=>({re,im});
const cadd=(a,b)=>C(a.re+b.re,a.im+b.im), csub=(a,b)=>C(a.re-b.re,a.im-b.im);
const cmul=(a,b)=>C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);
const cdiv=(a,b)=>{const d=b.re*b.re+b.im*b.im; return C((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d);};
const cabs=a=>Math.hypot(a.re,a.im), carg=a=>Math.atan2(a.im,a.re);
const cs=(k)=>C(k,0);
function solve2(a11,a12,a21,a22,b1,b2){ const det=csub(cmul(a11,a22),cmul(a12,a21)); return [cdiv(csub(cmul(b1,a22),cmul(a12,b2)),det), cdiv(csub(cmul(a11,b2),cmul(b1,a21)),det)]; }
function solve3(A,b){ // eliminación gaussiana compleja 3x3
  const M=A.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<3;i++){ let p=i; for(let r=i+1;r<3;r++) if(cabs(M[r][i])>cabs(M[p][i])) p=r; [M[i],M[p]]=[M[p],M[i]];
    for(let r=i+1;r<3;r++){ const f=cdiv(M[r][i],M[i][i]); for(let c=i;c<4;c++) M[r][c]=csub(M[r][c],cmul(f,M[i][c])); } }
  const x=[C(0),C(0),C(0)];
  for(let i=2;i>=0;i--){ let s=M[i][3]; for(let c=i+1;c<3;c++) s=csub(s,cmul(M[i][c],x[c])); x[i]=cdiv(s,M[i][i]); }
  return x;
}

/* ---------- controles ---------- */
function buildControls(container, specs, state, onChange, prefix='x'){
  container.innerHTML='';
  for(const sp of specs){
    if(sp.show && !sp.show(state)) continue;
    if(sp.type==='head'){ container.appendChild(el('h2',{},sp.label)); continue; }
    const id='c-'+prefix+'-'+(sp.id||sp.k);
    if(sp.type==='select'){
      const w=el('div',{class:'ctl sel'}); const lab=el('label',{for:id},sp.label); const s=el('select',{id});
      for(const [v,t] of sp.options){ const o=el('option',{value:v},t); if(state[sp.k]===v) o.selected=true; s.appendChild(o); }
      s.addEventListener('change',()=>{ state[sp.k]=s.value; onChange(sp.rebuild); });
      w.append(lab,s); container.appendChild(w); continue;
    }
    if(sp.type==='check'){
      const w=el('label',{class:'chk',for:id}); const c=el('input',{type:'checkbox',id}); c.checked=!!state[sp.k];
      c.addEventListener('change',()=>{ state[sp.k]=c.checked; onChange(sp.rebuild); });
      w.append(c,document.createTextNode(sp.label)); container.appendChild(w); continue;
    }
    const w=el('div',{class:'ctl'});
    const lab=el('label',{for:id}); lab.innerHTML=`<span>${sp.label}</span><span class="u">${sp.unit||''}</span>`;
    const r=el('input',{type:'range',id:id+'-r',min:0,max:1000,step:1,'aria-label':sp.label});
    const n=el('input',{type:'text',id,class:'num',inputmode:'decimal'});
    const toPos=v=> sp.log ? 1000*Math.log(v/sp.min)/Math.log(sp.max/sp.min) : 1000*(v-sp.min)/(sp.max-sp.min);
    const fromPos=p=>{ let v= sp.log ? sp.min*Math.pow(sp.max/sp.min,p/1000) : sp.min+(sp.max-sp.min)*p/1000; if(sp.step) v=Math.round(v/sp.step)*sp.step; return Number(v.toPrecision(3)); };
    const show=v=>{ n.value = sp.fmt? sp.fmt(v) : (sp.log? eng(v).replace(/ /g,'') : String(Number(v.toPrecision(4))).replace('.',',')); r.value=clamp(toPos(v),0,1000); };
    show(state[sp.k]);
    r.addEventListener('input',()=>{ state[sp.k]=fromPos(+r.value); n.value= sp.log? eng(state[sp.k]).replace(/ /g,'') : String(state[sp.k]).replace('.',','); onChange(false); });
    n.addEventListener('change',()=>{ const v=parseEng(n.value); if(Number.isFinite(v)){ state[sp.k]=v; show(v); onChange(false);} else show(state[sp.k]); });
    w.append(lab,r,n); container.appendChild(w);
  }
}
function readouts(container, items){
  container.innerHTML='';
  for(const it of items){ const d=el('div',{class:'read'+(it.cls?' '+it.cls:'')}); d.innerHTML=`<span class="k">${it.k}</span><span class="v">${it.v}</span>`; container.appendChild(d); }
}
function pills(container, items){
  container.innerHTML='';
  for(const it of items){ container.appendChild(el('span',{class:'pill'+(it.on?' on '+(it.cls||'warn'):'')},it.t)); }
}

/* ---------- pantalla de osciloscopio ---------- */
function setupCanvas(cv){ const dpr=window.devicePixelRatio||1; const w=cv.clientWidth||800; const h=Math.round(w*9/16); cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx,w,h}; }
function niceStep(range, n){ const raw=range/n; const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function drawScope(cv, o){
  const {ctx,w,h}=setupCanvas(cv);
  const L=56,R=12,T=12,B=34; const pw=w-L-R, ph=h-T-B;
  ctx.fillStyle=css('--scope'); ctx.fillRect(0,0,w,h);
  const x0=o.xmin, x1=o.xmax, y0=o.ymin, y1=o.ymax;
  const X=x=>L+(x-x0)/(x1-x0)*pw;
  const Y=y=>T+(1-(y-y0)/(y1-y0))*ph;
  ctx.font='12px '+css('--mono'); ctx.textBaseline='middle';
  // grid
  const ys=niceStep(y1-y0,8);
  ctx.strokeStyle=css('--grid'); ctx.lineWidth=1; ctx.fillStyle=css('--scope-text'); ctx.textAlign='right';
  for(let y=Math.ceil(y0/ys)*ys; y<=y1+1e-12; y+=ys){ const py=Y(y); ctx.beginPath(); ctx.moveTo(L,py); ctx.lineTo(L+pw,py); ctx.strokeStyle= Math.abs(y)<ys*1e-6? css('--grid-strong'):css('--grid'); ctx.stroke(); ctx.fillText(o.yfmt?o.yfmt(y):eng(y,o.yunit||'V',3),L-6,py); }
  ctx.textAlign='center'; ctx.textBaseline='top';
  if(o.logx){
    for(let d=Math.floor(Math.log10(x0)); d<=Math.ceil(Math.log10(x1)); d++){
      for(const m of [1,2,5]){ const f=m*Math.pow(10,d); if(f<x0||f>x1) continue; const px=L+Math.log10(f/x0)/Math.log10(x1/x0)*pw; ctx.strokeStyle= m===1?css('--grid-strong'):css('--grid'); ctx.beginPath(); ctx.moveTo(px,T); ctx.lineTo(px,T+ph); ctx.stroke(); if(m===1) ctx.fillText(eng(f,'Hz',2),px,T+ph+6); }
    }
  } else {
    const xs=niceStep(x1-x0,10);
    for(let x=Math.ceil(x0/xs)*xs; x<=x1+1e-15; x+=xs){ const px=X(x); ctx.strokeStyle=css('--grid'); ctx.beginPath(); ctx.moveTo(px,T); ctx.lineTo(px,T+ph); ctx.stroke(); ctx.fillText(o.xfmt?o.xfmt(x):eng(x,o.xunit||'s',3),px,T+ph+6); }
  }
  ctx.strokeStyle=css('--grid-strong'); ctx.strokeRect(L,T,pw,ph);
  // markers
  if(o.hlines) for(const hl of o.hlines){ if(hl.y<y0||hl.y>y1) continue; ctx.setLineDash([6,5]); ctx.strokeStyle=hl.color; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(L,Y(hl.y)); ctx.lineTo(L+pw,Y(hl.y)); ctx.stroke(); ctx.setLineDash([]); if(hl.label){ ctx.fillStyle=hl.color; ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText(hl.label,L+6,Y(hl.y)-2);} }
  if(o.vlines) for(const vl of o.vlines){ const px=o.logx? L+Math.log10(vl.x/x0)/Math.log10(x1/x0)*pw : X(vl.x); if(px<L||px>L+pw) continue; ctx.setLineDash([6,5]); ctx.strokeStyle=vl.color; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(px,T); ctx.lineTo(px,T+ph); ctx.stroke(); ctx.setLineDash([]); if(vl.label){ ctx.fillStyle=vl.color; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(vl.label,px+4,T+4);} }
  // traces
  ctx.save(); ctx.beginPath(); ctx.rect(L,T,pw,ph); ctx.clip();
  for(const tr of o.traces){
    ctx.strokeStyle=tr.color; ctx.lineWidth=tr.width||2; ctx.setLineDash(tr.dash||[]); ctx.beginPath();
    const n=tr.x.length; let started=false;
    for(let i=0;i<n;i++){ const xv=tr.x[i], yv=tr.y[i]; if(!Number.isFinite(yv)){started=false; continue;}
      const px=o.logx? L+Math.log10(xv/x0)/Math.log10(x1/x0)*pw : X(xv); const py=Y(clamp(yv,y0-(y1-y0),y1+(y1-y0)));
      if(!started){ctx.moveTo(px,py); started=true;} else ctx.lineTo(px,py); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
  if(o.xlabel){ ctx.fillStyle=css('--scope-text'); ctx.textAlign='right'; ctx.textBaseline='bottom'; ctx.fillText(o.xlabel,L+pw,h-2); }
}
function legend(container, items){ container.innerHTML=items.map(i=>`<span><i style="background:${i.c}"></i>${i.t}</span>`).join(''); }

/* ---------- pestañas ---------- */
const TABS=[['amp','Amplificadores'],['multi','Multientradas e instrumentación'],['osc','Oscilador Miller-Schmitt'],['fil','Filtros activos'],['src','Fuentes y reguladores'],['sw','Conmutados'],['act','Actividad práctica']];
const tabsNav=$('#tabs'); const renderers={};
function showTab(id){
  for(const [k] of TABS){ $('#tab-'+k).hidden = k!==id; const b=$('#tb-'+k); b.setAttribute('aria-selected', k===id?'true':'false'); }
  try{ localStorage.setItem('banco-tab',id); }catch(e){}
  if(renderers[id]) requestAnimationFrame(()=>renderers[id]());
}
for(const [k,t] of TABS){ const b=el('button',{id:'tb-'+k,role:'tab','aria-controls':'tab-'+k,type:'button'},t); b.addEventListener('click',()=>showTab(k)); tabsNav.appendChild(b); }

function benchLayout(pane, opts={}){
  pane.innerHTML='';
  const bench=el('div',{class:'bench'});
  const rack=el('div',{class:'rack'});
  const stage=el('div',{class:'stage'});
  const screen=el('div',{class:'screen'}); const cv=el('canvas',{role:'img','aria-label':opts.aria||'Pantalla del osciloscopio'}); const leg=el('div',{class:'legend'});
  screen.append(cv,leg);
  const flags=el('div',{class:'flags'});
  const reads=el('div',{class:'reads'});

function srcFn(s){
  const w=2*Math.PI*s.f;
  if(s.wave==='seno') return t=>s.off+s.A*Math.sin(w*t);
  if(s.wave==='cuadrada') return t=>{ const ph=(t*s.f)%1; return s.off+(ph<0.5?s.A:-s.A); };
  return t=>{ const ph=(t*s.f+0.25)%1; return s.off+s.A*(ph<0.5? (4*ph-1) : (3-4*ph)); };
}
function simAmp(s){
  const op=OPAMPS[s.op]; const VOH=s.vcc-s.drop, VOL=-(s.vcc-s.drop);
  const VOS= s.vos? op.VOS : 0;
  const T=1/s.f; const per=s.circuit==='integrador'?4:4; const pre= s.circuit==='integrador'?0:3;
  const N=1600*per; const dt=T/1600; const total=(pre+per)*1600;
  const src=srcFn(s); const rnd=rng(12345);
  let y=0, ylpf=0, vop=VOL, vc=0; let slewed=false, clipped=false;
  if(['schmittni','schmittinv','comparador'].includes(s.circuit)){ y=VOL; }
  const tx=[],vin=[],vout=[],aux=[]; let lastIn=src(-dt);
  const trans=[]; let prevSign=Math.sign(y)||-1;
  const noiseGain = s.circuit==='seguidor'?1:(['inversor','noinv'].includes(s.circuit)?1+s.RF/s.R1:1);
  const fcl= op.GBW/noiseGain; const kl= Number.isFinite(fcl)? 1-Math.exp(-dt*2*Math.PI*fcl):1;
  const maxStep= op.SR*dt;
  for(let i=0;i<total;i++){
    const t=i*dt; let vi=src(t); if(s.noise>0) vi+= s.noise*(rnd()*2-1);
    let target;
    switch(s.circuit){
      case 'inversor': target=-(s.RF/s.R1)*vi+(1+s.RF/s.R1)*VOS; break;
      case 'noinv': target=(1+s.RF/s.R1)*(vi+VOS); break;
      case 'seguidor': target=vi+VOS; break;
      case 'comparador': target=op.Ad*(vi-s.Vref+VOS); break;
      case 'schmittni': { const vp=vi*s.RF/(s.RF+s.R1)+y*s.R1/(s.RF+s.R1); target=op.Ad*(vp-s.Vth+VOS); break; }
      case 'schmittinv': { const vp=s.Vth*s.RF/(s.RF+s.R1)+y*s.R1/(s.RF+s.R1); target=op.Ad*(vp-vi+VOS); break; }
      case 'integrador': { let d=-(vi-VOS)/(s.R*s.Cc); if(s.useRF) d-= (y-VOS)/(s.RFint*s.Cc); if(Math.abs(d*dt)>maxStep){ d=Math.sign(d)*op.SR; slewed=true; } target=y+d*dt; break; }
      case 'derivador': { let i_c; if(s.Rs>0){ const tau=s.Rs*s.Cc; vc+= (vi-vc)*(1-Math.exp(-dt/tau)); i_c=(vi-vc)/s.Rs; } else { i_c=s.Cc*(vi-lastIn)/dt; } target=-s.R*i_c; break; }
      case 'rectificador': { const tgt= vi>0 ? vi+0.6 : -op.Ad*1e-3; const d=clamp(tgt,VOL,VOH)-vop; if(Math.abs(d)>maxStep){ vop+=Math.sign(d)*maxStep; slewed=true;} else vop+=d; target=clamp(vop-0.6,0,Math.max(vi,0)); break; }
    }
    lastIn=vi;
    if(s.circuit==='rectificador'){ y=target; }
    else if(s.circuit==='integrador'){ if(target>VOH||target<VOL) clipped=true; y=clamp(target,VOL,VOH); }
    else {
      let tg=target; if(tg>VOH){tg=VOH; if(!['comparador','schmittni','schmittinv'].includes(s.circuit)) clipped=true;} if(tg<VOL){tg=VOL; if(!['comparador','schmittni','schmittinv'].includes(s.circuit)) clipped=true;}
      if(['inversor','noinv','seguidor'].includes(s.circuit)){ ylpf+= (tg-ylpf)*kl; tg=ylpf; }
      const d=tg-y; if(Math.abs(d)>maxStep){ y+=Math.sign(d)*maxStep; if(i>=pre*1600) slewed=true; } else y=tg;
    }
    if(i>=pre*1600){
      tx.push(t-pre*T); vin.push(vi); vout.push(y);
      if(['schmittni','schmittinv','comparador'].includes(s.circuit)){ const sg=Math.sign(y)||prevSign; if(sg!==prevSign){ trans.push({vi,dir:sg}); prevSign=sg; } }
    } else { prevSign=Math.sign(y)||prevSign; }

}
function stats(a){ let mn=Infinity,mx=-Infinity,sum=0; for(const v of a){ if(v<mn)mn=v; if(v>mx)mx=v; sum+=v; } return {min:mn,max:mx,pp:mx-mn,mean:sum/a.length}; }

function schmittTh(s,r){
  const VOH=r?r.VOH:s.vcc-s.drop, VOL=r?r.VOL:-(s.vcc-s.drop);

}

const os={R:68e3,C:10e-9,R1:10e3,RF:27e3,VOH:14,VOL:-13,V:0,op:'tl081',pwm:false,vc:1};
function simOsc(s){
  const op=OPAMPS[s.op]; const VH=(s.VOH-s.VOL)*s.R1/s.RF;
  const V1=-s.VOL*s.R1/s.RF, V2=-s.VOH*s.R1/s.RF;
  if(!(s.V<s.VOH && s.V>s.VOL)) return {err:'V debe quedar entre VOL y VOH para que el integrador cambie de sentido.'};
  if(V1>s.VOH||V2<s.VOL) return {err:'Los umbrales del Schmitt quedan fuera de la excursión del integrador: aumente RF o reduzca R1.'};
  const T1=VH*s.R*s.C/(s.VOH-s.V), T2=VH*s.R*s.C/(s.V-s.VOL), T=T1+T2;
  const dt=T/3000, n=Math.round(12*T/dt);
  let v1=0, v2=s.VOH; const maxStep=op.SR*dt;
  const tx=[],a=[],b=[],c=[]; const edges=[]; let prev=v2;
  for(let i=0;i<n;i++){
    // integrador: entrada + en V
    let d=-(v2-s.V)/(s.R*s.C); if(Math.abs(d*dt)>maxStep) d=Math.sign(d)*op.SR; v1=clamp(v1+d*dt,s.VOL,s.VOH);

    const vp=v1*s.RF/(s.RF+s.R1)+v2*s.R1/(s.RF+s.R1); const tg= vp>0? s.VOH:s.VOL; const e=tg-v2; v2+= Math.abs(e)>maxStep? Math.sign(e)*maxStep : e;
    if(prev<0 && v2>=0 && i*dt>4*T) edges.push(i*dt); prev=v2;
    if(i*dt>=9*T){ tx.push(i*dt-9*T); a.push(v1); b.push(v2); c.push(v1<s.vc? s.VOH*0.5 : s.VOL*0.5); }
  }
  let fm=NaN; if(edges.length>2) fm=(edges.length-1)/(edges[edges.length-1]-edges[0]);
  let hi=0; for(const v of b) if(v>0) hi++; const D=hi/b.length;
  let pw=0; for(const v of c) if(v>0) pw++;
  return {tx,a,b,c,VH,V1,V2,T1,T2,T,fm,D,Dpwm:pw/c.length};
}

  pa1:{t:'Pasa altos de primer orden (inversor)',eq:'H = −(RF/R1)·jωR1C/(1 + jωR1C)    fc = 1/(2π·R1·C)'},

function filH(s,f){

    case 'pb1': return cdiv(cs(-s.RF/s.R1), cadd(cs(1),cmul(sj,cs(s.RF*s.Cf))));
    case 'pa1': { const x=cmul(sj,cs(s.R1*s.Cf)); return cmul(cs(-s.RF/s.R1), cdiv(x,cadd(cs(1),x))); }
    case 'skpb': { // nodos X, Y ; vo = K·vY
      const g1=cs(1/s.R1),g2=cs(1/s.R2),y1=cmul(sj,cs(s.C1)),y2=cmul(sj,cs(s.C2)),K=cs(s.K);

    case 'skpa': { const y1=cmul(sj,cs(s.C1)),y2=cmul(sj,cs(s.C2)),K=cs(s.K);

function filTheory(s){

  }
}

const sp={vrms:12,fred:60,red:0,rect:'puente',vd:0.8,Cap:4700e-6,load:'I',IO:1,RL:12,reg:'none',

function regulate(s,vin){
  const IL=v=> s.load==='I'? s.IO : v/s.RL;

  if(s.reg==='zener'){
    const R=s.Rz; let vOff = s.load==='I'? vin-s.IO*R : vin*s.RL/(R+s.RL);
    if(vOff<=s.VZ){ const io=IL(vOff); return {vo:vOff,iin:(vin-vOff)/R,pd:{R:(vin-vOff)**2/R,Z:0},IZ:0,flag:'zener'}; }

    const IZ=(vo-s.VZ)/s.rZ; return {vo,iin:(vin-vo)/R,pd:{R:(vin-vo)**2/R,Z:vo*IZ},IZ,flag: IZ<s.IZK?'zener':''};
  }

    let vo=s.VZs-0.65, flag='';

      const R=s.Rb; let vB; const vOff=vin-IB*R;
      if(vOff<=s.VZs){ vB=vOff; flag='zener'; } else { vB=(vin/R+s.VZs/s.rZ-IB)/(1/R+1/s.rZ); }
      vo=Math.min(vB-0.65, vin-0.3); if(vin-0.3<vB-0.65) flag='dropout'; }
    const IO2=IL(vo)+vo/s.RS; const IB=IO2/(s.beta+1); const vB=vo+0.65; const IR=(vin-vB)/s.Rb; const IZ=Math.max(IR-IB,0);
    return {vo,iin:IO2-IB+IR,pd:{Q:(vin-vo)*(IO2-IB),R:IR*IR*s.Rb,Z:vB*IZ,RS:vo*vo/s.RS},IZ,flag};
  }
  const Vn = s.reg==='78xx'? s.fix : 1.25*(1+s.R2l/s.R1l)+50e-6*s.R2l;
  const vdo = s.reg==='78xx'? 2.0 : 2.5; const iq= s.reg==='78xx'? 0.005 : 1.25/s.R1l+50e-6;
  let vo=Vn*(1+1e-4*(vin-Vn-vdo)), flag=''; if(vin-vdo<Vn){ vo=Math.max(vin-vdo,0); flag='dropout'; }

function simSupply(s){

  for(let i=0;i<n;i++){
    const t=i*dt; const vs=Vm*Math.sin(2*Math.PI*f*t);
    let r= s.rect==='media'? (vs>s.vd? vs-s.vd : 0) : Math.max(Math.abs(vs)-nd*s.vd,0);
    const rg=regulate(s,vc);
    if(r>=vc){ vc=r; if(i>=(ncy-3)*4000) condTot+=dt; }

      const g=regulate(s,vc); tx.push(t-(ncy-3)*T); vr.push(r); vcv.push(vc); vov.push(g.vo);

    }

}

function simSw(s){
  const T=1/s.fs, spc=400, dt=T/spc; const D=clamp(s.D,0.01,0.95);
  const Vid= s.topo==='buck'? D*s.VI : s.topo==='boost'? s.VI/(1-D) : s.VI*D/(1-D);
  const R= Vid/Math.max(s.IO,1e-6);

  const rec={t:[],i:[],v:[],g:[]};
  for(c=0;c<maxC;c++){
    let sum=0; const keep = false;
    for(let k=0;k<spc;k++){
      const on=k<D*spc; let vL, ic;
      if(s.topo==='buck'){ if(on){ vL=s.VI-v; ic=iL-v/R; } else { vL= iL>0? -v:0; ic=Math.max(iL,0)-v/R; } }
      else { if(on){ vL=s.VI; ic=-v/R; } else { vL= iL>0? (s.topo==='boost'? s.VI-v : -v) : 0; ic=(iL>0?iL:0)-v/R; } }
      iL+=vL/s.L*dt; if(iL<0){ iL=0; dcm=true; }
      v+=ic/s.Cs*dt; sum+=v;
    }
    const avg=sum/spc; if(c>50 && Math.abs(avg-lastAvg)<1e-6*Math.max(1,Math.abs(avg))) break; lastAvg=avg; if(c===50) dcm=false;
  }
  dcm=false; let imin=Infinity,imax=-Infinity,vmin=Infinity,vmax=-Infinity;
  for(let cy=0;cy<4;cy++) for(let k=0;k<spc;k++){
    const on=k<D*spc; let vL,ic;
    if(s.topo==='buck'){ if(on){ vL=s.VI-v; ic=iL-v/R; } else { vL= iL>0? -v:0; ic=Math.max(iL,0)-v/R; } }
    else { if(on){ vL=s.VI; ic=-v/R; } else { vL= iL>0? (s.topo==='boost'? s.VI-v : -v) : 0; ic=(iL>0?iL:0)-v/R; } }
    iL+=vL/s.L*dt; if(iL<0){ iL=0; dcm=true; } v+=ic/s.Cs*dt;
    rec.t.push((cy*spc+k)*dt); rec.i.push(iL); rec.v.push(s.topo==='inv'?-v:v); rec.g.push(on?1:0);

 {id:2,tema:'Amplificador inversor',txt:'Se necesita un inversor con ganancia −4,7 e impedancia de entrada de 22 kΩ. a) Calcule R1 y RF exactos. b) Elija RF comercial de la serie E12 y recalcule la ganancia. c) Calcule R+ para balancear con el valor comercial.',f:['R1','RF exacta','RF comercial','Ganancia con RF comercial','R+ de balance'],go:()=>preset('amp',amp,{circuit:'inversor',R1:22e3,RF:22e3,op:'ideal',vcc:15,drop:1.5,A:1,f:1000,wave:'seno',off:0,noise:0})},
 {id:3,tema:'Slew rate',txt:'Un amplificador debe entregar 5 V pico senoidales. a) ¿Cuál es la frecuencia máxima sin deformación por slew rate con un LM741 (0,5 V/µs)? b) ¿Y con un TL081 (13 V/µs)? c) Verifique en el simulador con un no inversor de ganancia 5 (R1 = 10 kΩ, RF = 40 kΩ) y 1 Vp de entrada.',f:['fp con LM741','fp con TL081'],go:()=>preset('amp',amp,{circuit:'noinv',R1:10e3,RF:40e3,op:'lm741',vcc:15,drop:1.5,A:1,f:1000,wave:'seno',off:0,noise:0})},
 {id:4,tema:'Multientradas universal',txt:'Diseñe vO = 5·v1 − 2·v2 con v1 en la entrada no inversora, RF = 100 kΩ y circuito balanceado. Use la regla A+ = A− + 1 para decidir si falta una resistencia auxiliar, dónde va y cuánto vale. Entregue R de v1, R de v2, RAUX y verifique R+ = R−.',f:['R de v1 (entrada +)','R de v2 (entrada −)','RAUX: valor y entrada','R+ y R−'],go:()=>preset('multi',mu,{v1:0,R1:0,v2:0,R2:0,v3:0,R3:0,v4:0,R4:0,RauxN:0,RauxP:0,RF:100e3})},
 {id:5,tema:'Schmitt no inversor',txt:'Con ±15 V (VOH = +13,5 V, VOL = −13,5 V) diseñe un Schmitt no inversor con V1 = +2 V y V2 = −1 V usando R1 = 10 kΩ. Calcule RF y el voltaje de referencia V en la entrada −.',f:['RF','V (referencia)','VH'],go:()=>preset('amp',amp,{circuit:'schmittni',R1:10e3,RF:100e3,Vth:0,vcc:15,drop:1.5,op:'ideal',wave:'triangular',A:5,f:100,off:0,noise:0,xy:true})},
 {id:6,tema:'Schmitt inversor',txt:'Con las mismas fuentes, diseñe un Schmitt inversor con V1 = +3 V y V2 = +1 V. Tome RF = 125 kΩ. a) Calcule R1 (Thevenin del divisor) y V. b) Implemente V y R1 con un divisor RA–RB desde +15 V.',f:['R1','V','RA (a +15 V)','RB (a tierra)'],go:()=>preset('amp',amp,{circuit:'schmittinv',R1:10e3,RF:125e3,Vth:0,vcc:15,drop:1.5,op:'ideal',wave:'triangular',A:6,f:100,off:2,noise:0,xy:true})},
 {id:7,tema:'Oscilador Miller-Schmitt',txt:'Con VOH = +13,5 V, VOL = −13,5 V y V = 0, diseñe un oscilador que entregue un triángulo de 6 Vpp a 2 kHz. Use C = 10 nF y R1 = 10 kΩ. Calcule RF y R. Verifique la frecuencia y la amplitud en el simulador.',f:['RF','R','Umbrales V1 y V2'],go:()=>preset('osc',os,{C:10e-9,R1:10e3,RF:27e3,R:68e3,VOH:13.5,VOL:-13.5,V:0,op:'ideal'})},
 {id:8,tema:'Sallen-Key pasa bajos',txt:'Diseñe un Sallen-Key pasa bajos de ganancia unitaria (K = 1), Butterworth, con fc = 2 kHz y R1 = R2 = 10 kΩ. Calcule C1 y C2 y verifique fc y Q en el diagrama de Bode.',f:['C1','C2','Q'],go:()=>preset('fil',fl,{topo:'skpb',R1:10e3,R2:10e3,K:1,C1:10e-9,C2:10e-9,ftest:2000})},
 {id:9,tema:'Pasa banda MFB',txt:'Diseñe un pasa banda de realimentación múltiple con f0 = 500 Hz, Q = 4, ganancia en el centro A0 = −1 y C = 22 nF. Calcule R1, R2 y R3 y el ancho de banda.',f:['R1','R2','R3','Ancho de banda'],go:()=>preset('fil',fl,{topo:'mfb',C:22e-9,R1:10e3,R2:100e3,R3:1e3,ftest:500})},
 {id:10,tema:'Fuente primaria y LM317',txt:'Un transformador de 15 Vrms alimenta un puente (0,8 V por diodo) y una carga de 0,5 A constantes a 60 Hz. a) Calcule Vm y V1. b) Elija C para un rizado máximo de 1 Vpp (aproximación y valor comercial). c) Diseñe un LM317 de 12 V con R1 = 240 Ω y estime su potencia disipada.',f:['Vm','V1','C (cálculo)','C comercial','R2 del LM317','Potencia en el LM317'],go:()=>preset('src',sp,{vrms:15,fred:60,red:0,rect:'puente',vd:0.8,load:'I',IO:0.5,reg:'none',Cap:1000e-6,R1l:240,R2l:720})},
 {id:11,tema:'Regulador paralelo con zener',txt:'Diseñe un regulador con zener de 5,1 V (IZK = 1 mA) para una carga de 0 a 20 mA, con VI entre 9 y 11 V. Calcule R máxima, el valor comercial y las potencias del zener y de R en el peor caso.',f:['R máxima','R comercial','Potencia en el zener','Potencia en R'],go:()=>preset('src',sp,{vrms:7.4,rect:'puente',vd:0.8,Cap:4700e-6,load:'I',IO:0.02,reg:'zener',VZ:5.1,IZK:1e-3,rZ:5,Rz:330})},
 {id:12,tema:'Conversor reductor',txt:'Diseñe un conversor directo de 24 V a 5 V para 2 A, a 50 kHz. El rizado de corriente en la bobina debe ser como máximo 30 % de IO y el rizado de salida como máximo 20 mVpp. Calcule D, L mínima y C mínima.',f:['D','L mínima','C mínima'],go:()=>preset('sw',sw,{topo:'buck',VI:24,D:0.5,fs:50e3,L:47e-6,Cs:22e-6,IO:2})}
];
function preset(tab,obj,vals){ Object.assign(obj,vals); const pane=$('#tab-'+tab); if(pane._ui){ pane._ui._built=false; if(tab==='multi'||tab==='osc'||tab==='sw'){ pane._ui=null; } } showTab(tab); window.scrollTo({top:0}); }
function loadAns(){ try{ return JSON.parse(localStorage.getItem('banco-respuestas')||'{}'); }catch(e){ return {}; } }
function saveAns(a){ try{ localStorage.setItem('banco-respuestas',JSON.stringify(a)); }catch(e){} }
function renderAct(){
  const pane=$('#tab-act'); if(pane._done) return; pane._done=true;
  const ans=loadAns();
  const intro=el('div',{class:'note'});
  intro.innerHTML=`<p><b>Actividad práctica: diseñar, calcular y verificar</b></p>
  <p>Resuelva cada ejercicio en papel con las ecuaciones de la clase. Escriba sus resultados en los campos y luego pulse «Abrir en el simulador»: el montaje se carga con los datos del enunciado pero sin su diseño. Ingrese sus valores y compruebe que lo medido coincide con lo pedido. Use valores comerciales cuando el ejercicio lo indique.</p>
  <div class="row"><input id="alumno" class="num" style="font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--fg);min-width:0;flex:1 1 220px" placeholder="Nombre del estudiante" aria-label="Nombre del estudiante">
  <button class="btn" type="button" id="copy-ans">Copiar respuestas</button><button class="btn ghost" type="button" id="clear-ans">Borrar respuestas</button><span class="status" id="ans-status"></span></div>
  <pre id="ans-text" hidden style="white-space:pre-wrap;font:13px var(--mono);background:var(--sunk);padding:10px;border-radius:6px;max-width:100%;overflow-x:auto"></pre>`;
  const list=el('div',{class:'exlist'});
  pane.append(intro,list);
  $('#alumno').value=ans.alumno||''; $('#alumno').addEventListener('input',e=>{ ans.alumno=e.target.value; saveAns(ans); });
  for(const ex of EX){
    const d=el('article',{class:'ex'});
    d.innerHTML=`<span class="meta">Ejercicio ${ex.id} · ${ex.tema}</span><h3>${ex.tema}</h3><p>${ex.txt}</p>`;
    const g=el('div',{class:'ans'});
    ex.f.forEach((lab,i)=>{ const key=`e${ex.id}_${i}`; const L=el('label',{for:key}); L.textContent=lab; const I=el('input',{id:key,type:'text',autocomplete:'off'}); I.value=ans[key]||''; I.addEventListener('input',()=>{ ans[key]=I.value; saveAns(ans); }); L.appendChild(I); g.appendChild(L); });
    const b=el('button',{class:'btn ghost',type:'button'},'Abrir en el simulador'); b.addEventListener('click',ex.go);
    d.append(g,el('div',{class:'row'}),); d.lastChild.appendChild(b); list.appendChild(d);
  }
  $('#copy-ans').addEventListener('click',()=>{
    const lines=[`Actividad: Banco de pruebas análogo`,`Estudiante: ${ans.alumno||''}`];
    for(const ex of EX){ lines.push(`\nEjercicio ${ex.id} (${ex.tema})`); ex.f.forEach((lab,i)=>lines.push(`  ${lab}: ${ans['e'+ex.id+'_'+i]||''}`)); }
    const txt=lines.join('\n'); const pre=$('#ans-text'); pre.textContent=txt;
    const st=$('#ans-status');
    navigator.clipboard.writeText(txt).then(()=>{ st.textContent='Respuestas copiadas. Péguelas en el correo o la plataforma del curso.'; pre.hidden=true; })
      .catch(()=>{ pre.hidden=false; const rg=document.createRange(); rg.selectNodeContents(pre); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg); st.textContent='No se pudo copiar automáticamente: el texto quedó seleccionado abajo, cópielo con Ctrl+C.'; });
  });
  const clr=$('#clear-ans'); let armed=false;
  clr.addEventListener('click',()=>{ if(!armed){ armed=true; clr.textContent='Confirmar: borrar todo'; setTimeout(()=>{armed=false; clr.textContent='Borrar respuestas';},4000); return; }
    for(const k in ans) delete ans[k]; saveAns(ans); pane.querySelectorAll('input').forEach(i=>i.value=''); armed=false; clr.textContent='Borrar respuestas'; $('#ans-status').textContent='Respuestas borradas.'; });
}
renderers.act=renderAct;

/* ---------- arranque ---------- */
let startTab='amp'; try{ const t=localStorage.getItem('banco-tab'); if(t && TABS.some(x=>x[0]===t)) startTab=t; }catch(e){}
if(location.hash && TABS.some(x=>'#'+x[0]===location.hash)) startTab=location.hash.slice(1);
showTab(startTab);
let rz; window.addEventListener('resize',()=>{ cancelAnimationFrame(rz); rz=requestAnimationFrame(()=>{ const cur=TABS.find(x=>!$('#tab-'+x[0]).hidden); if(cur && renderers[cur[0]] && cur[0]!=='act') renderers[cur[0]](); }); });
if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ const cur=TABS.find(x=>!$('#tab-'+x[0]).hidden); if(cur&&cur[0]!=='act') renderers[cur[0]](); });
</script>
